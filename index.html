<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Study Hub - लाइव नोट्स पोर्टल</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7f6; color: #333; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 25px 15px; text-align: center; }
        .filter-bar { background: #162b52; padding: 12px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .filter-bar button { background: white; color: #162b52; border: none; padding: 8px 14px; margin: 4px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .filter-bar button:hover, .filter-bar button.active { background: #ffd700; color: #000; }
        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); border-top: 5px solid #2a5298; display: flex; flex-direction: column; justify-content: space-between; }
        .badge { display: inline-block; background: #e8f4fd; color: #1e3c72; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .card h2 { color: #1e3c72; font-size: 19px; margin-bottom: 8px; }
        .card p { color: #555; font-size: 14px; margin-bottom: 15px; }
        .btn { display: block; background: #2a5298; color: white; padding: 10px; text-decoration: none; border-radius: 5px; text-align: center; font-weight: bold; }
        .btn:hover { background: #1e3c72; }
        footer { background: #1e3c72; color: white; text-align: center; padding: 25px 15px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>📚 All Study Hub (ज्ञान सागर)</h1>
        <p>कक्षा 5वीं से लेकर PhD तक के फ्री नोट्स व स्टडी मटेरियल</p>
    </header>

    <!-- कक्षा चुनने के फिल्टर बटन -->
    <div class="filter-bar">
        <button class="active" onclick="filterNotes('All', this)">सभी कक्षाएं</button>
        <button onclick="filterNotes('Class 5-8', this)">कक्षा 5-8</button>
        <button onclick="filterNotes('Class 9-10', this)">कक्षा 9-10</button>
        <button onclick="filterNotes('Class 11-12', this)">कक्षा 11-12</button>
        <button onclick="filterNotes('College UG', this)">कॉलेज (UG)</button>
        <button onclick="filterNotes('College PG', this)">कॉलेज (PG)</button>
        <button onclick="filterNotes('PhD & Research', this)">PhD व रिसर्च</button>
    </div>

    <div class="container">
        <div id="loading" style="text-align:center; padding: 30px; font-size: 18px;">नोट्स लोड हो रहे हैं...</div>
        <div class="grid" id="notes-container"></div>
    </div>

    <footer>
        <p>💻 <strong>अपने स्कूल या कोचिंग के लिए वेबसाइट बनवाने हेतु संपर्क करें: aapkaemail@gmail.com</strong></p>
        <p style="font-size: 13px; margin-top: 8px; opacity: 0.8;">© 2026 All Study Hub</p>
    </footer>

    <script>
        const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIWC4ZVnPZJDmxLxKPXmzyw5IusiLI3BIxfJuf6eWIp4KsC6XRksX8MS2E44rtXWVU2GJmiBikEj8L/pub?gid=951860803&single=true&output=csv";

        let allNotes = [];

        async function loadNotes() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                const rows = data.split("\n").slice(1);

                allNotes = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length >= 5) {
                        return {
                            className: cols[1].replace(/"/g, "").trim(),
                            subject: cols[2].replace(/"/g, "").trim(),
                            details: cols[3].replace(/"/g, "").trim(),
                            link: cols[4].replace(/"/g, "").trim()
                        };
                    }
                }).filter(item => item && item.subject);

                document.getElementById("loading").style.display = "none";
                displayNotes(allNotes.reverse());
            } catch (error) {
                document.getElementById("loading").innerText = "नोट्स लोड करने में समस्या आ रही है।";
            }
        }

        function displayNotes(notes) {
            const container = document.getElementById("notes-container");
            container.innerHTML = "";
            if (notes.length === 0) {
                container.innerHTML = "<p style='text-align:center; width:100%;'>इस कक्षा के नोट्स जल्द ही जोड़े जाएंगे।</p>";
                return;
            }
            notes.forEach(note => {
                container.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="badge">${note.className}</span>
                            <h2>${note.subject}</h2>
                            <p>${note.details}</p>
                        </div>
                        <a href="${note.link}" target="_blank" class="btn">📖 नोट्स / क्लास खोलें →</a>
                    </div>
                `;
            });
        }

        function filterNotes(category, btn) {
            document.querySelectorAll(".filter-bar button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            if (category === "All") {
                displayNotes(allNotes);
            } else {
                const filtered = allNotes.filter(n => n.className === category);
                displayNotes(filtered);
            }
        }

        loadNotes();
    </script>
</body>
</html>
